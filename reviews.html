<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Split -- Betting Reviews</title>
<link rel="stylesheet" href="dive.css"/>
<style>
.stamp{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800}
table.res{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 16px}
table.res th,table.res td{text-align:left;padding:8px 6px;border-bottom:1px solid #2a3644;vertical-align:top}
table.res th{color:#93a3b5;font-size:11px}
table.res tr.total td{border-top:2px solid #d4a017;font-weight:800;color:#d4a017}
h3.track{color:#d4a017;font-size:13px;letter-spacing:.08em;margin:16px 0 6px}
.ok{color:#3dd68c;font-weight:800}.loss{color:#ff6b6b;font-weight:800}.push{color:#d4a017;font-weight:800}
.bank{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.bank div{background:#121820;border:1px solid #2a3644;border-radius:12px;padding:12px;text-align:center}
.bank b{display:block;color:#93a3b5;font-size:10px}.bank span{font-size:20px;font-weight:800}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.filters button{background:#0e141c;border:1px solid #2a3644;color:#93a3b5;border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer}
.filters button.on{border-color:#d4a017;color:#d4a017}
</style></head>
<body>
<div class="topnav"><a href="today.html">TODAY</a><a href="index.html">HOME</a><a href="reviews.html">BETTING REVIEWS</a></div>
<header>
  <div class="brand">THE SPLIT</div>
  <div class="week">BETTING REVIEWS</div>
  <div class="meta">Filter by confidence. Scores refresh every two minutes.</div>
</header>
<div class="wrap">
  <div class="bank" id="review-bank"></div>
  <div class="filters" id="conf-filters">
    <button class="on" data-f="ALL">ALL</button>
    <button data-f="BET">BET ONLY</button>
    <button data-f="LEAN">LEAN+</button>
    <button data-f="FADE">FADE</button>
  </div>
  <div id="review-tables"><p class="note">Loading ledger...</p></div>
</div>
<script src="tracker.js?v=9"></script>
<script>
window.REVIEW_FILTER = "ALL";
function loadScores(){
  return new Promise(function(ok){
    var s = document.createElement("script");
    s.src = "scores.js?v=" + Date.now();
    s.onload = ok; s.onerror = ok;
    document.body.appendChild(s);
  });
}
async function refreshReviews(){
  await loadScores();
  await renderReviews(window.REVIEW_FILTER);
}
document.getElementById("conf-filters").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  window.REVIEW_FILTER = b.getAttribute("data-f");
  document.querySelectorAll("#conf-filters button").forEach(x => x.classList.toggle("on", x===b));
  refreshReviews();
});
refreshReviews();
setInterval(refreshReviews, 120000);
</script>
</body></html>
