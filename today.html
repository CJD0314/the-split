<title>The Split -- Today</title>
<link rel="stylesheet" href="dive.css"/>
<style>
.bank{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.bank div{background:#121820;border:1px solid #2a3644;border-radius:12px;padding:14px;text-align:center}
.bank b{display:block;color:#93a3b5;font-size:10px;letter-spacing:.1em}
.bank span{font-size:22px;font-weight:800}
.row{background:#121820;border:1px solid #2a3644;border-radius:12px;padding:12px;margin:8px 0}
.row a{color:#d4a017;font-weight:800;text-decoration:none}
.stamp{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.06em}
.stamp.open{background:#3d2a00;color:#d4a017}
.stamp.locked{background:#0d2a1c;color:#3dd68c}
.stamp.settled{background:#1a2230;color:#93a3b5}
@media(max-width:700px){.bank{grid-template-columns:1fr 1fr}}
</style></head>

<div class="topnav"><a href="today.html">TODAY</a> &nbsp;|&nbsp; <a href="index.html">HOME</a></div>

</header>
<div class="wrap">

<details class="block" open><summary>TODAY'S TICKETS</summary>
<div class="body" id="tickets"><p class="note">Loading ledger...</p></div></details>
<details class="block" open><summary>QUICK REVIEWS</summary>
<div class="body" id="loops"></div></details>
<details class="block" open><summary>FADES TO REMEMBER</summary>
