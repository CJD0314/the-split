<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Split -- Bet Tracker</title>
<link rel="stylesheet" href="dive.css"/>
<style>
header h1{margin-bottom:4px}
.bank{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px auto 0;max-width:420px}
.bank div{background:#121820;border:1px solid #2a3644;border-radius:10px;padding:8px 10px;text-align:center}
.bank b{display:block;color:#93a3b5;font-size:10px;letter-spacing:.1em}
.bank span{display:block;font-size:16px;font-weight:800;margin-top:2px}
@media(min-width:700px){.bank{grid-template-columns:repeat(4,1fr);max-width:720px}}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.filters button{background:#121820;border:1px solid #2a3644;color:#f3f7fb;font-weight:800;letter-spacing:.06em;font-size:11px;padding:7px 10px;border-radius:999px}
.filters button.on{border-color:#e8b423;color:#e8b423}
.lab{color:#93a3b5;font-size:10px;letter-spacing:.14em;font-weight:800;margin:14px 0 6px}
.day-sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:8px 2px 10px;border-bottom:1px solid #2a3644;margin-bottom:8px}
.day-sum b{font-size:16px}
.day-sum span{color:#93a3b5;font-size:13px;font-weight:700}
.g-block{border-bottom:1px solid #2a3644;padding:8px 0}
.g-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.g-head a{color:#e8b423;font-weight:800;text-decoration:none;font-size:14px}
.g-head em{color:#93a3b5;font-style:normal;font-size:11px;font-weight:700}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:baseline;padding:5px 0}
.row .kind{color:#93a3b5;font-size:11px;font-weight:800;letter-spacing:.06em}
.row .pick{font-size:14px;font-weight:800;line-height:1.3}
.row .end{text-align:right;white-space:nowrap;font-size:13px;font-weight:800}
.row .end small{display:block;color:#93a3b5;font-size:11px;font-weight:700}
.stamp{display:inline-block;font-size:10px;letter-spacing:.08em;font-weight:800;border:1px solid #2a3644;border-radius:6px;padding:2px 6px;margin-left:6px}
.stamp.bet{color:#3dd68c;border-color:#3dd68c}
.stamp.lean{color:#e8b423;border-color:#e8b423}
.stamp.fade{color:#93a3b5}
details.block>summary{font-size:13px}
.empty{color:#93a3b5;padding:12px 0}
</style>
</head>
<body>

</div>
<header>
<div class="brand">THE SPLIT</div>
<div class="week">BET TRACKER</div>
<h1>TICKET LOG</h1>
<div class="bank" id="review-bank"></div>
</header>
<div class="wrap">
<p class="lab">DAY</p>
<div class="filters" id="day-filters"></div>
<p class="lab">SPORT</p>
<div class="filters" id="sport-filters"></div>
<p class="lab">TICKET</p>
<div class="filters" id="conf-filters"></div>
<div id="review-tables"><p class="note">Loading ledger...</p></div>
</div>
<script src="tracker.js?v=36"></script>
<script src="tracker-cards.js?v=2"></script>
<script src="stamp.js?v=6"></script>
</body>
</html>
