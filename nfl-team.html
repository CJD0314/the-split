<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Split -- Team Identity</title>
<link rel="stylesheet" href="dive.css"/>
</head>
<body>
<div class="topnav">
<a href="today.html">TODAY</a>
<a href="nfl.html">NFL</a>
<a href="nfl-defense-week-1.html">DEFENSE</a>
<a href="reviews.html">BET TRACKER</a>
</div>
<div id="one"><p class="note">Loading identity...</p></div>
<script src="nfl-id-a.js?v=1"></script>
<script src="nfl-id-b.js?v=1"></script>
<script src="nfl-identities.js?v=3"></script>
<script src="nfl-id-def.js?v=1"></script>
<script>
(function(){
  const id = new URLSearchParams(location.search).get("t") || "";
  const t = (window.NFL_IDENTITIES || {})[id];
  const box = document.getElementById("one");
  if (!t){
    box.innerHTML = "<div class='wrap'><p class='note'>Pick a club from the NFL page.</p><p><a class='full-link' href='nfl.html'>NFL</a></p></div>";
    return;
  }
  document.title = "The Split -- " + t.name;
  const def = t.def ? `<details class="block" open><summary>DEFENSIVE HOLE ON THIS TAPE</summary><div class="body"><p>${t.def}</p></div></details>` : "";
  box.innerHTML = `<header><div class="brand">THE SPLIT</div><div class="week">${t.name.toUpperCase()}</div><div class="meta">Identity book · built to feed the next full breakdown</div></header><div class="wrap"><div class="market"><div class="tile"><b>WEEK 1</b><span>${t.w1}</span><span>${t.ticket}</span></div><div class="tile"><b>POINTS</b><span>FOR ${t.pf}</span><span>AGT ${t.pa}</span></div><div class="tile"><b>ENGINE</b><span>${t.engine}</span><span>${t.style}</span></div><div class="tile"><b>KEY STAT</b><span>${t.stat}</span></div></div><details class="block" open><summary>WHO THEY ARE ON THIS TAPE</summary><div class="body"><p>${t.who}</p></div></details>${def}<details class="block" open><summary>HOW WE BET THEM</summary><div class="body"><p>${t.bet}</p></div></details><details class="block" open><summary>HOW WE PLAY THEM IN DFS</summary><div class="body"><p>${t.dfs}</p></div></details><details class="block" open><summary>USE THIS IN THE NEXT BREAKDOWN</summary><div class="body"><p>${t.next}</p></div></details><p><a class="full-link" href="${t.rev}">GAME REVIEW</a> · <a class="full-link" href="nfl-defense-week-1.html">ALL DEFENSIVE HOLES</a> · <a class="full-link" href="nfl.html">NFL</a></p></div>`;
})();
</script>
</body></html>
