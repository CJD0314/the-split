<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Split -- Today</title>
<link rel="stylesheet" href="dive.css"/>
<style>
.row{background:#121820;border:1px solid #2a3644;border-radius:12px;padding:14px;margin:10px 0}
.row a{color:#d4a017;font-weight:800;text-decoration:none;font-size:12px}
.row-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.row-head b{font-size:16px;flex:1}
.tix-head,.tix{display:grid;grid-template-columns:64px 1fr 140px 72px 72px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #2a3644;font-size:14px}
.tix-head{border-top:none;color:#93a3b5;font-size:10px;letter-spacing:.08em;font-weight:800}
.tix-type{color:#d4a017;font-weight:800;font-size:11px;letter-spacing:.06em}
.tix-pick{font-weight:800}
.tix-stake{color:#93a3b5;font-size:13px}
.stamp{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.06em;text-align:center}
.stamp.open{background:#3d2a00;color:#d4a017}
.stamp.locked{background:#0d2a1c;color:#3dd68c}
.stamp.settled{background:#1a2230;color:#93a3b5}
.stamp.bet{background:#0d2a1c;color:#3dd68c}
.stamp.lean{background:#3d2a00;color:#d4a017}
.stamp.fade{background:#3a1212;color:#ff6b6b}
.ok{color:#3dd68c;font-weight:800}.loss{color:#ff6b6b;font-weight:800}.push{color:#d4a017;font-weight:800}
@media(max-width:640px){
  .tix-head{display:none}
  .tix{grid-template-columns:1fr 1fr;gap:4px 10px}
  .tix-type{grid-column:1}
  .tix-pick{grid-column:1 / -1;font-size:16px}
  .tix-stake{grid-column:1}
}
</style></head>
<body>
<div class="topnav"><a href="today.html">TODAY</a><a href="index.html">HOME</a><a href="reviews.html">BETTING REVIEWS</a></div>
<header>
<div class="brand">THE SPLIT</div>
<div class="week">TODAY</div>
<div class="meta" id="tagline">Tickets stay until midnight ET.</div>
<div class="updated" id="pass-line"></div>
</header>
<div class="wrap">
<p class="note">Finished games stay on this page until the next calendar day. Game recaps live on each REVIEW board. Quick reviews are lessons only.</p>
<details class="block"><summary>TODAY'S TICKETS</summary>
<div class="body" id="tickets"><p class="note">Loading ledger...</p></div></details>
<details class="block"><summary>QUICK REVIEWS</summary>
<div class="body" id="loops"></div></details>
<details class="block"><summary>FADES TO REMEMBER</summary>
<div class="body" id="fades"></div></details>
</div>
<script src="last_pass.js?v=1"></script>
<script src="scores.js?v=3"></script>
<script src="tracker.js?v=13"></script>
<script src="stamp.js"></script>
<script>
if (window.LAST_PASS) {
  var el = document.getElementById("pass-line");
  if (el) el.textContent = window.LAST_PASS;
}
renderToday();
if (window.closeAllTabs) closeAllTabs();
</script>
</body></html>
