<script>
const KICK = {
  "OU at MICH":"12:00 p.m. ET", "ASU at TAMU":"12:00 p.m. ET", "ORE at OKST":"12:00 p.m. ET",
  "HOW at IU":"12:00 p.m. ET", "PSU at TEM":"12:00 p.m. ET", "WKU at UGA":"12:45 p.m. ET",
  "ALA at UK":"3:30 p.m. ET", "RICE at ND":"3:30 p.m. ET", "ARIZ at BYU":"3:30 p.m. ET",
  "USU at WASH":"3:30 p.m. ET", "UCD at SMU":"4:00 p.m. ET",
  "TENN at GT":"7:00 p.m. ET", "SOU at HOU":"7:00 p.m. ET",
  "OSU at TEX":"7:30 p.m. ET", "LT at LSU":"7:30 p.m. ET", "TTU at ORST":"7:30 p.m. ET",
  "ISU at IOWA":"7:30 p.m. ET", "CHAR at MISS":"7:45 p.m. ET",
  "ARK at UTAH":"10:15 p.m. ET", "ULL at USC":"11:00 p.m. ET",
  "COL at DET":"1:10 p.m. ET", "NYM at NYY":"1:35 p.m. ET", "PIT at CHC":"2:20 p.m. ET",
  "BAL at TOR":"3:07 p.m. ET", "LAD at MIA":"4:10 p.m. ET"
};
function kickMin(game){
  const t = KICK[game] || "";
  const m = t.match(/(\d+):(\d+)\s*(a\.m\.|p\.m\.)/i);
  if (!m) return 9999;
  let h = Number(m[1]); const min = Number(m[2]);
  if (/p/i.test(m[3]) && h !== 12) h += 12;
  if (/a/i.test(m[3]) && h === 12) h = 0;
  return h * 60 + min;
}
function gameScore(b){
  const map = window.SCORES || {};
  const raw = map[(b.date || "") + "|" + b.game] || map[b.game] || b.final || "";
  if (/\d+:\d+/.test(raw) && !/final|live|inning|qtr/i.test(raw)) return "";
  return raw;
}
function parseFinal(sc){
  const s = String(sc || "");
  if (!/final/i.test(s)) return null;
  const m = s.match(/FINAL\s+([A-Z0-9&]+)\s+(\d+)\s*-\s*(\d+)/i);
  if (!m) return null;
  return { winner: m[1].toUpperCase(), hi: Number(m[2]), lo: Number(m[3]) };
}
function gameTeams(game){
  const p = String(game || "").split(/\s+at\s+/i);
  return { away: (p[0] || "").trim().toUpperCase(), home: (p[1] || "").trim().toUpperCase() };
}
function teamScores(b){
  const f = parseFinal(gameScore(b));
  if (!f) return null;
  const t = gameTeams(b.game);
  if (!t.away || !t.home) return null;
  const loser = f.winner === t.home ? t.away : (f.winner === t.away ? t.home : "");
  if (!loser) return null;
  const out = {};
  out[f.winner] = f.hi;
  out[loser] = f.lo;
  return out;
}
function pickBits(b){
  const src = [b.close, b.booked, b.pick].filter(Boolean).join(" ");
  const t = String(b.type || "").toLowerCase();
  if (t === "total") {
    const tot = String(src).match(/\b([ou])\s*(\d+(?:\.\d+)?)/i);
    if (tot) return { kind: "total", side: tot[1].toLowerCase(), line: Number(tot[2]) };
  }
  const spr = String(src).match(/\b([A-Z]{2,4})\s+([+-]\d+(?:\.\d+)?)\b/);
  if (spr) {
    const n = Number(spr[2]);
    if (Math.abs(n) < 80) return { kind: (t === "ml" ? "ml" : "spread"), team: spr[1].toUpperCase(), line: n };
  }
  const ml = String(src).match(/\b([A-Z]{2,4})\s+([+-]\d{3,})\b/);
  if (ml || t === "ml") {
    const team = ml ? ml[1].toUpperCase() : null;
    return { kind: "ml", team: team };
  }
  return null;
}
function gradeTicket(b){
  const settled = String(b.result || "").toUpperCase();
  if (settled === "WIN" || settled === "LOSS" || settled === "PUSH") return settled;
  const t = String(b.type || "").toLowerCase();
  if (t === "hr" || t === "td" || t === "prop") return "";
  const scores = teamScores(b);
  if (!scores) return "";
  const bits = pickBits(b);
  if (!bits) return "";
  const total = Object.values(scores).reduce((a,n)=>a+n,0);
  if (bits.kind === "total") {
    if (bits.side === "o") {
      if (total > bits.line) return "WIN";
      if (total < bits.line) return "LOSS";
      return "PUSH";
    }
    if (total < bits.line) return "WIN";
    if (total > bits.line) return "LOSS";
    return "PUSH";
  }
  if (!bits.team || scores[bits.team] == null) return "";
  const mine = scores[bits.team];
  const theirs = Object.keys(scores).filter(k => k !== bits.team).map(k => scores[k])[0];
  if (theirs == null) return "";
  if (bits.kind === "ml" || bits.line == null) {
    if (mine > theirs) return "WIN";
    if (mine < theirs) return "LOSS";
    return "PUSH";
  }
  const adj = mine + bits.line;
  if (adj > theirs) return "WIN";
  if (adj < theirs) return "LOSS";
  return "PUSH";
}
function resultStamp(res){
  if (!res) return "";
  const r = String(res).toUpperCase();
  const cls = r === "WIN" ? "win" : r === "LOSS" ? "loss" : "push";
  return `<span class="stamp ${cls}">${r}</span>`;
}
function flatRow(b){
  const conf = String(b.confidence || "LEAN").toUpperCase();
  const href = b.href || "#";
  const day = (b.date || "").slice(5).replace("-", "/");
  const kick = KICK[b.game] || "";
  const live = gameScore(b);
  const grade = gradeTicket(b);
  const name = b.sport === "CFB" && window.rankCfbGame ? window.rankCfbGame(b.game) : b.game;
  const when = [day, kick].filter(Boolean).join(" \u00b7 ");
  const scoreTxt = live || b.status || "OPEN";
  return `<div class="g-row">
    <div class="g-main">
      <span class="g-name">${name}</span>
      <span class="g-pick">${b.pick} \u00b7 ${b.close || ""}</span>
      <span class="g-when">${when}</span>
    </div>
    <div class="g-side">
      <span class="stamp ${conf.toLowerCase()}">${conf}</span>
      ${resultStamp(grade)}
      <span class="g-score">${scoreTxt}</span>
      <a href="${href}">GAME DETAIL</a>
    </div>
  </div>`;
}
function prettyCard(iso){
  const p = (iso || "").split("-");
  if (p.length !== 3) return iso || "";
  const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return d.toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric", year:"numeric"}).toUpperCase();
}
function flatGameList(rows){
  const seen = {};
  const list = [];
  (rows || []).slice().sort((a,b)=> kickMin(a.game) - kickMin(b.game)).forEach(b => {
    if (seen[b.game]) return;
    seen[b.game] = true;
    list.push(b);
  });
  return list.map(flatRow).join("") || `<p class="note">Nothing posted.</p>`;
}
function mlbBuckets(rows){
  const sort = (arr) => arr.slice().sort((a,b)=> kickMin(a.game) - kickMin(b.game));
  const side = sort(rows.filter(b => !isTdHr(b) && !isPlayerProp(b)));
  const hr = sort(rows.filter(b => String(b.type||"").toLowerCase()==="hr"));
  const prop = sort(rows.filter(isPlayerProp));
  return sportDrop("SIDE", side.map(flatRow).join(""), false)
    + sportDrop("HR BEST BETS", hr.map(flatRow).join(""), false)
    + sportDrop("BEST PLAYER PROP", prop.map(flatRow).join(""), false);
}
async function paintStayAway(){
  const data = await loadLedger();
  const day = cardDate();
  const order = ["NFL","CFB","MLB"];
  const fades = document.getElementById("fades");
  if (!fades) return;
  const away = order.map(sp => {
    const rows = (data.bets||[]).filter(b => b.sport === sp && b.date === day && isFade(b) && !isTdHr(b) && !isPlayerProp(b));
    if (!rows.length) return "";
    return sportDrop(sp, flatGameList(rows), false);
  }).filter(Boolean);
  fades.innerHTML = away.length ? away.join("") : `<p class="note">No stay-away tickets dated ${day}.</p>`;
}
function keepTicketsOpen(){
  const el = document.getElementById("tickets-block");
  if (el) el.setAttribute("open", "");
}
const _rt = renderToday;
renderToday = async function(){
  await _rt();
  await paintStayAway();
  const el = document.getElementById("card-date");
  if (el) el.textContent = prettyCard(cardDate());
  if (window.splitStamp) splitStamp();
  keepTicketsOpen();
};
renderToday();
if (window.closeAllTabs) closeAllTabs();
keepTicketsOpen();
</script>
