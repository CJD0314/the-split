<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Split -- Today</title>
<link rel="stylesheet" href="sport.css?v=17"/>
<style>
.card-date{color:#3dd68c;font-size:15px;font-weight:800;letter-spacing:.08em;margin:4px 0 0}
.unit{background:#0e141c;border:1px solid #3dd68c;border-radius:12px;padding:12px;margin:8px 0}
.unit .who{font-size:18px;font-weight:800;line-height:1.2}
.unit .num{color:#3dd68c;font-size:16px;font-weight:800;margin-top:4px}
.unit .meta{color:#93a3b5;font-size:12px;margin-top:4px}
.unit a{color:#d4a017;font-weight:800;font-size:12px}
.slate{background:#0e141c;border:1px solid #2a3644;border-radius:12px;padding:12px;margin:8px 0}
.slate-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.slate-h b{font-size:15px}
.slate-h .when{color:#93a3b5;font-size:12px}
.tick{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid #2a3644}
.tick .line{font-weight:800;font-size:14px}
.tick .kind{color:#93a3b5;font-size:11px;letter-spacing:.08em;font-weight:800;margin-right:6px}
.stamp{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.06em}
.stamp.bet{background:#0d2a1c;color:#3dd68c}
.stamp.lean{background:#3d2a00;color:#d4a017}
.stamp.fade{background:#3a1212;color:#ff6b6b}
.count{color:#93a3b5;font-size:12px;margin:0 0 8px}
.slate a{color:#d4a017;font-weight:800;font-size:12px}
</style>
</head>
<body>
<div class="topnav">
<a class="on" href="today.html">TODAY</a>
<a href="nfl.html">NFL</a>
<a href="cfb.html">CFB</a>
<a href="mlb.html">MLB</a>
<a href="reviews.html">BET TRACKER</a>
</div>
<header>
<div class="brand">THE SPLIT</div>
<div class="sub">TODAY</div>
<div class="card-date" id="card-date"></div>
</header>
<div class="wrap">
<details class="block" id="units-block" open>
<summary>UNITS</summary>
<div class="body" id="units"><p class="note">Loading…</p></div>
</details>
<details class="block" id="tickets-block" open>
<summary>SLATE</summary>
<div class="body" id="tickets"><p class="note">Loading…</p></div>
</details>
<details class="block" id="away-block">
<summary>STAY AWAY</summary>
<div class="body" id="fades"></div>
</details>
</div>
<script src="tracker.js?v=41"></script>
<script src="stamp.js?v=6"></script>
<script>
const KICK = {
  "UGA at ARK":"Noon ET",
  "KENT at OSU":"Noon ET",
  "BUFF at PSU":"Noon ET",
  "UK at TAMU":"3:30 p.m. ET",
  "FSU at ALA":"3:30 p.m. ET",
  "USC at RUTG":"3:30 p.m. ET",
  "SMU at LOU":"3:30 p.m. ET",
  "USU at UTAH":"3:30 p.m. ET",
  "UTEP at MICH":"3:30 p.m. ET",
  "WKU at IU":"4:00 p.m. ET",
  "UNI at IOWA":"4:00 p.m. ET",
  "TROY at MIZ":"7:00 p.m. ET",
  "LSU at MISS":"7:30 p.m. ET",
  "MSU at ND":"7:30 p.m. ET",
  "UNM at OU":"7:30 p.m. ET",
  "BYU at CSU":"7:30 p.m. ET",
  "WVU vs UVA":"7:30 p.m. ET",
  "KENN at TENN":"7:45 p.m. ET",
  "UTSA at TEX":"8:00 p.m. ET",
  "HOU at TTU":"7:00 p.m. ET",
  "MIA at WAKE":"7:00 p.m. ET",
  "PORT at ORE":"10:15 p.m. ET",
  "SYR at PITT":"7:30 p.m. ET"
};
function kickMin(game){
  const t = KICK[game] || "";
  if (/noon/i.test(t)) return 12 * 60;
  const m = t.match(/(\d+):(\d+)\s*(a\.m\.|p\.m\.)/i);
  if (!m) return 9999;
  let h = Number(m[1]); const min = Number(m[2]);
  if (/p/i.test(m[3]) && h !== 12) h += 12;
  if (/a/i.test(m[3]) && h === 12) h = 0;
  return h * 60 + min;
}
function prettyCard(iso){
  const p = (iso || "").split("-");
  if (p.length !== 3) return iso || "";
  const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return d.toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric", year:"numeric"}).toUpperCase();
}
function confOf(b){ return String(b.confidence || "LEAN").toUpperCase(); }
function typeOf(b){ return String(b.type || "ml").toLowerCase(); }
function kindLabel(b){
  const t = typeOf(b);
  if (t === "hr") return "HR";
  if (t === "td") return "TD";
  if (t === "prop") return "PROP";
  if (t === "total") return "TOTAL";
  if (t === "ml") return "ML";
  return "SIDE";
}
function lineOf(b){
  const close = String(b.close || "").trim();
  const pick = String(b.pick || "").trim();
  const t = typeOf(b);
  if (t === "hr" || t === "td" || t === "prop") {
    if (pick && close && pick !== close && close.indexOf(pick) < 0) return pick + " · " + close;
    return pick || close;
  }
  return close || pick;
}
function typeRank(b){
  const t = typeOf(b);
  if (t === "ml" || t === "spread" || t === "side") return 0;
  if (t === "total") return 1;
  if (t === "hr" || t === "td") return 2;
  return 3;
}
function confRank(b){
  const c = confOf(b);
  if (c === "BET") return 0;
  if (c === "LEAN") return 1;
  return 2;
}
function unitCard(b){
  const kick = KICK[b.game] || "";
  const href = b.href || "#";
  return `<div class="unit">
    <div class="who">${b.game}</div>
    <div class="num">${lineOf(b)}</div>
    <div class="meta">${kick || "Time TBD"} · $100 to win $${b.to_win || "—"}</div>
    <a href="${href}">FULL BREAKDOWN</a>
  </div>`;
}
function tickLine(b){
  return `<div class="tick">
    <div><span class="kind">${kindLabel(b)}</span><span class="line">${lineOf(b)}</span></div>
    <span class="stamp ${confOf(b).toLowerCase()}">${confOf(b)}</span>
  </div>`;
}
function slateCard(game, rows){
  const kick = KICK[game] || "";
  const href = (rows.find(function(b){ return b.href; }) || {}).href || "#";
  const ticks = rows.slice().sort(function(a,b){
    const tr = typeRank(a) - typeRank(b);
    if (tr) return tr;
    return confRank(a) - confRank(b);
  }).map(tickLine).join("");
  return `<div class="slate">
    <div class="slate-h"><b>${game}</b><span class="when">${kick}</span><a href="${href}">BREAKDOWN</a></div>
    ${ticks}
  </div>`;
}
function groupGames(rows){
  const map = {};
  (rows || []).forEach(function(b){
    if (!b.game) return;
    map[b.game] = map[b.game] || [];
    map[b.game].push(b);
  });
  return Object.keys(map).sort(function(a,b){ return kickMin(a) - kickMin(b); })
    .map(function(g){ return slateCard(g, map[g]); }).join("");
}
function section(sp, html){
  if (!html) return "";
  return `<div class="day">${sp}</div>${html}`;
}
async function paintTodayCard(){
  const data = await loadLedger();
  const day = cardDate();
  const dateEl = document.getElementById("card-date");
  if (dateEl) dateEl.textContent = prettyCard(day);

  const dayBets = (data.bets || []).filter(function(b){ return b.date === day; });
  const units = dayBets.filter(function(b){
    return confOf(b) === "BET" && (typeOf(b) === "ml" || typeOf(b) === "spread" || typeOf(b) === "side" || !b.type);
  }).slice().sort(function(a,b){ return kickMin(a.game) - kickMin(b.game); });

  const unitsEl = document.getElementById("units");
  if (unitsEl){
    unitsEl.innerHTML = units.length
      ? `<p class="count">${units.length} unit${units.length===1?"":"s"}. Leans live on the slate.</p>` + units.map(unitCard).join("")
      : `<p class="note">No BET tickets dated ${day}. Leans and fades are on the slate.</p>`;
  }

  const tickets = document.getElementById("tickets");
  if (tickets){
    const order = ["NFL","CFB","MLB"];
    const html = order.map(function(sp){
      const rows = dayBets.filter(function(b){ return b.sport === sp && (isFire(b) || isFade(b)); });
      if (!rows.length) return "";
      const bets = rows.filter(function(b){ return confOf(b)==="BET"; }).length;
      const leans = rows.filter(function(b){ return confOf(b)==="LEAN"; }).length;
      const fades = rows.filter(function(b){ return confOf(b)==="FADE"; }).length;
      return section(sp, `<p class="count">${bets} BET · ${leans} LEAN · ${fades} FADE</p>` + groupGames(rows));
    }).filter(Boolean);
    tickets.innerHTML = html.length ? html.join("") : `<p class="note">No tickets dated ${day}.</p>`;
  }

  const fades = document.getElementById("fades");
  if (fades){
    const fireGames = {};
    dayBets.filter(isFire).forEach(function(b){ if (b.game) fireGames[b.game] = true; });
    const only = dayBets.filter(function(b){
      return isFade(b) && !isTdHr(b) && !isPlayerProp(b) && !fireGames[b.game];
    });
    fades.innerHTML = only.length
      ? groupGames(only)
      : `<p class="note">Juice fades sit on the slate card. Nothing extra to hide.</p>`;
  }
  if (window.splitStamp) splitStamp();
}
renderToday = paintTodayCard;
paintTodayCard();
</script>
</body></html>
