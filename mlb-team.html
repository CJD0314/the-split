<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Split -- MLB Team Identity</title>
<link rel="stylesheet" href="dive.css"/>
<style>
.id-row{display:grid;grid-template-columns:88px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:start}
.id-row:last-child{border-bottom:0}
.id-k{color:var(--muted);font-size:11px;letter-spacing:.08em;font-weight:800;padding-top:2px}
.id-v{font-size:16px;line-height:1.5;font-weight:600}
.id-list{margin:0;padding-left:1.1em}
.id-list li{margin:8px 0;font-size:16px;line-height:1.5}
.sec{color:var(--gold);font-size:12px;letter-spacing:.14em;font-weight:800;margin:18px 0 6px}
@media(max-width:520px){.id-row{grid-template-columns:72px 1fr}}
</style>
</head>
<body>
<div class="topnav">
<a href="today.html">TODAY</a>
<a href="mlb.html">MLB</a>
<a href="reviews.html">BET TRACKER</a>
</div>
<div id="one"><p class="note">Loading identity...</p></div>
<script src="mlb-identities.js?v=2"></script>
<script>
(function(){
  const raw = new URLSearchParams(location.search).get("t") || "";
  const I = window.MLB_IDENTITIES || {};
  const key = raw === "cws" ? "chw" : raw === "ath" ? "oak" : raw;
  const t = I[key] || I[raw];
  const box = document.getElementById("one");
  if (!t){
    box.innerHTML = "<div class='wrap'><p class='note'>Pick a club from the MLB page.</p><p><a class='full-link' href='mlb.html'>MLB</a></p></div>";
    return;
  }
  document.title = "The Split -- " + t.name;
  function bits(s){
    if (!s) return [];
    return String(s).split(/\.\s+/).map(function(x){ return x.replace(/\.$/,"").trim(); }).filter(function(x){ return x && x.length > 2; });
  }
  function bullets(s){
    const a = bits(s);
    if (!a.length) return "<p class='note'>Posts after the next card.</p>";
    return "<ul class='id-list'>" + a.map(function(x){ return "<li>"+x+"</li>"; }).join("") + "</ul>";
  }
  function row(k, v){
    if (v == null || v === "") return "";
    return "<div class='id-row'><div class='id-k'>"+k+"</div><div class='id-v'>"+v+"</div></div>";
  }
  function block(title, inner, open){
    if (!inner) return "";
    return `<details class="block"${open ? " open" : ""}><summary>${title}</summary><div class="body">${inner}</div></details>`;
  }
  const logo = "https://a.espncdn.com/i/teamlogos/mlb/500/" + (I[key] ? key : raw) + ".png";
  box.innerHTML = `<header>
    <div class="brand">THE SPLIT</div>
    <div class="week">MLB TEAM IDENTITY</div>
    <div class="logos"><img src="${logo}" alt=""/></div>
    <h1>${t.name.toUpperCase()}</h1>
    <div class="meta">${t.div||""} · ${t.park||""}</div>
  </header>
  <div class="wrap">
    <div class="sec">READ THIS FIRST</div>
    ${block("WHO THEY ARE", "<p>"+(t.who||"Tape posts after the next card.")+"</p>", true)}
    ${block("STAFF", "<p>"+(t.staff||"Posts after the next card.")+"</p>", true)}
    ${block("KEY PLAYERS", bullets(t.keys), true)}
    ${block("PARK", "<p>"+(t.park||"")+"</p>", true)}
    <div class="sec">HOW THE CARD BREAKS</div>
    ${block("HOW THEY WIN", bullets(t.howwin), true)}
    ${block("WHERE IT BROKE", bullets(t.howlose), true)}
    ${block("LAST TAPE", bullets(t.tape), true)}
    <div class="sec">USE THIS TOMORROW</div>
    ${block("CARRY INTO THE NEXT CARD", bullets(t.carry), true)}
    ${block("THE BET", bullets(t.bet), true)}
    <p><a class="full-link" href="mlb.html">MLB</a></p>
  </div>`;
})();
</script>
<script src="stamp.js?v=6"></script>
</body></html>
