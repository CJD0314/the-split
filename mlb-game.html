<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>The Split -- MLB</title><link rel="stylesheet" href="dive.css"/></head>
<body><div id="app"></div>
<script src="mlb-data.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
const g = window.MLB && window.MLB[id];
const L = c => "https://a.espncdn.com/i/teamlogos/mlb/500/"+c+".png";
if (!g) {
  document.getElementById("app").innerHTML = '<div class="topnav"><a href="index.html">HOME</a></div><div class="wrap"><p>Board for this game is still being filled to the Mets-Yankees standard. Live: nym-nyy, pit-chc, phi-atl, lad-mia, cin-mil, hou-tb.</p></div>';
} else {
  document.title = "The Split -- "+g.awayName+" at "+g.homeName;
  document.getElementById("app").innerHTML = `
  <div class="topnav"><a href="index.html">HOME</a></div>
  <header><div class="brand">THE SPLIT</div><div class="week">MLB &nbsp; FRIDAY SEPT 11</div>
  <div class="logos"><img src="${L(g.away)}"/><img src="${L(g.home)}"/></div>
  <h1>${g.awayName.toUpperCase()} VS ${g.homeName.toUpperCase()}</h1>
  <div class="meta">${g.when}</div></header>
  <div class="wrap">
  <div class="market">
    <div class="tile"><b>SPREAD</b><span>Current: ${g.spread}</span><span>Open: ${g.spread}</span></div>
    <div class="tile"><b>TOTAL</b><span>Current: ${g.total}</span><span>Open: ${g.total}</span></div>
    <div class="tile"><b>MONEYLINE</b><span>Current: ${g.ml}</span><span>Open: ${g.ml}</span></div>
    <div class="tile"><b>MOVE</b><span>${g.move}</span></div>
  </div>
  <details class="block" open><summary>TEAM BREAKDOWN</summary><div class="body">
    <div class="tb-row teams">
      <div class="team-head"><img src="${L(g.away)}"/><div><b>${g.awayName.toUpperCase()}</b><div class="note">${g.awayNote}</div></div></div>
      <div class="team-head"><img src="${L(g.home)}"/><div><b>${g.homeName.toUpperCase()}</b><div class="note">${g.homeNote}</div></div></div>
    </div>
    <div class="tb-row"><h3>STAFF</h3><ul><li><b>Manager ${g.mgr[0]}</b></li></ul><ul><li><b>Manager ${g.mgr[1]}</b></li></ul></div>
    <div class="tb-row"><h3>STARTING PITCHER</h3><ul><li>${g.sp[0]} -- full line and MLB rank land on the detailed board.</li></ul><ul><li>${g.sp[1]} -- full line and MLB rank land on the detailed board.</li></ul></div>
    <div class="tb-row"><h3>BULLPEN STATUS</h3><ul><li>${g.status[0]}</li></ul><ul><li>${g.status[1]}</li></ul></div>
    <div class="tb-row"><h3>TRENDS AND IN THE NEWS</h3><ul><li>Last 10 and streak post with the standings pull.</li></ul><ul><li>Playoff math in the notes where it applies.</li></ul></div>
  </div></details>
  <details class="block" open><summary>INACTIVES</summary><div class="body">
  <h3>${g.awayName.toUpperCase()}</h3><p>Position-player IL and scratches only. Pitchers stay in bullpen status.</p>
  <h3>${g.homeName.toUpperCase()}</h3><p>Position-player IL and scratches only.</p></div></details>
  <details class="block" open><summary>SCRIPT</summary><div class="body">
    <h3>${g.awayName.toUpperCase()} WIN IF</h3><p>What they are playing for and how the starter has to work.</p>
    <h3>${g.homeName.toUpperCase()} WIN IF</h3><p>Same for the home club.</p>
  </div></details>
  <details class="block" open><summary>PITCHER VS HITTERS</summary><div class="body"><p>Working card from MLB.com plus season line and vs-pitcher line when the sample exists. Pitcher tendency notes go here.</p></div></details>
  <details class="block" open><summary>BEST BET</summary><div class="body"><div class="callout"><div style="font-size:22px;font-weight:800">${g.bet}</div><div style="margin-top:6px">${g.stake}</div></div><ul>${g.why.map(x=>"<li>"+x+"</li>").join("")}</ul></div></details>
  <details class="block" open><summary>HR BEST BET</summary><div class="body"><div class="callout"><div style="font-size:22px;font-weight:800">${g.hr}</div></div></div></details>
  </div>`;
}
</script></body></html>
