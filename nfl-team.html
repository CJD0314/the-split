<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Split -- Team Identity</title>
<link rel="stylesheet" href="dive.css"/>
</head>
<body>
<div class="topnav">
<a href="nfl.html">NFL</a>
<a href="nfl-offense-week-1.html">OFFENSE</a>
<a href="nfl-defense-week-1.html">HOLES</a>
</div>
<div id="one"><p class="note">Loading identity...</p></div>
<script src="nfl-id-a.js?v=3"></script>
<script src="nfl-id-b.js?v=2"></script>
<script src="nfl-identities.js?v=8"></script>
<script src="nfl-id-def.js?v=3"></script>
<script src="nfl-id-off.js?v=3"></script>
<script src="nfl-id-book.js?v=1"></script>
<script>
(function(){
  const raw = new URLSearchParams(location.search).get("t") || "";
  const I = window.NFL_IDENTITIES || {};
  const t = I[raw] || I[raw === "was" ? "wsh" : raw === "wsh" ? "was" : raw];
  const box = document.getElementById("one");
  if (!t){
    box.innerHTML = "<div class='wrap'><p class='note'>Pick a club from the NFL page.</p><p><a class='full-link' href='nfl.html'>NFL</a></p></div>";
    return;
  }
  document.title = "The Split -- " + t.name;
  function block(title, val){
    if (!val) return "";
    return `<details class="block" open><summary>${title}</summary><div class="body"><p>${val}</p></div></details>`;
  }
  const broke = t.broke || t.offhole || "";
  box.innerHTML = `<header><div class="brand">THE SPLIT</div><div class="week">${t.name.toUpperCase()}</div><div class="meta">${t.w1||""} · ${t.ticket||""} · FOR ${t.pf} / AGT ${t.pa}</div></header><div class="wrap">
<div class="market">
<div class="tile"><b>IDENTITY</b><span>${t.style||""}</span></div>
<div class="tile"><b>ENGINE</b><span>${t.engine||""}</span></div>
<div class="tile"><b>STAT</b><span>${t.stat||""}</span></div>
</div>
${block("WHO THEY ARE", t.who)}
${block("STAFF", t.staff)}
${block("KEY PLAYERS", t.keys)}
${block("CARRY INTO THE NEXT DIVE", t.carry)}
${block("WHERE THE OFFENSE BROKE", broke)}
${block("HOW THE OFFENSE WORKS", t.offscheme)}
${block("WHO MOVED THE BALL", t.engine2)}
${block("HOW THE DEFENSE WORKS", t.scheme)}
${block("WHAT THEY SENT (BLITZ)", t.blitz)}
${block("WHAT THEY SHOWED (SIM PRESSURE)", t.sim)}
${block("WHERE THE DEFENSE BROKE", t.def)}
${block("THE BET", t.bet)}
${block("DFS ONLY", t.dfs)}
${block("NEXT BREAKDOWN STARTS HERE", t.next)}
${block("OFFENSE RULE FOR THE NEXT DIVE", t.howoff)}
<p><a class="full-link" href="${t.rev||"nfl.html"}">GAME REVIEW</a> · <a class="full-link" href="nfl.html">NFL</a></p></div>`;
})();
</script>
</body></html>
