<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Split -- Today</title>
<link rel="stylesheet" href="sport.css?v=18"/>
<style>
.card-date{color:#3dd68c;font-size:13px;font-weight:800;letter-spacing:.1em;margin:2px 0 8px}
.window{margin:18px 0 8px;color:#d4a017;font-size:12px;font-weight:800;letter-spacing:.14em}
.gsum{display:flex;justify-content:space-between;align-items:center;gap:10px;width:calc(100% - 28px)}
.gsum .left{min-width:0}
.gsum .gname{display:block;font-size:16px;font-weight:800;color:#f3f7fb;letter-spacing:0}
.gsum .gline{display:block;font-size:13px;color:#d5deea;margin-top:3px;font-weight:700}
.stamp{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.06em;flex:0 0 auto}
.stamp.bet{background:#0d2a1c;color:#3dd68c}
.stamp.lean{background:#3d2a00;color:#d4a017}
.stamp.fade{background:#3a1212;color:#ff6b6b}
.stamp.pass{background:#1a2230;color:#93a3b5}
.kv{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;margin:8px 0}
.kv b{color:#93a3b5;font-size:11px;letter-spacing:.1em;padding-top:3px}
.kv span{font-size:16px;font-weight:800;line-height:1.3}
.kv .away{color:#ff8a8a;font-size:14px}
.count{color:#93a3b5;font-size:13px;margin:0 0 8px}
.unit{background:#0e141c;border:1px solid #3dd68c;border-radius:12px;padding:12px;margin:8px 0}
.unit .who{font-size:18px;font-weight:800}
.unit .num{color:#3dd68c;font-size:16px;font-weight:800;margin-top:4px}
</style>
</head>
<body>
<div class="topnav">

<a href="nfl.html">NFL</a>

</div>
<header>
<div class="brand">THE SPLIT</div>
<div class="sub">TODAY</div>
<div class="card-date" id="card-date"></div>
</header>
<div class="wrap">
<details class="block" id="units-block">
<summary>UNITS</summary>
<div class="body" id="units"></div>
</details>
<details class="block" id="tickets-block" open>
<summary>SUNDAY CARD</summary>
<div class="body" id="tickets"><p class="note">Loading…</p></div>
</details>
</div>
<script src="tracker.js?v=42"></script>
<script src="stamp.js?v=6"></script>
<script>
const KICK = {
  "CAR at ATL":"1:00 p.m. ET","MIN at CHI":"1:00 p.m. ET","PHI at TEN":"1:00 p.m. ET","PIT at NE":"1:00 p.m. ET",
  "GB at NYJ":"1:00 p.m. ET","CLE at TB":"1:00 p.m. ET","NO at BAL":"1:00 p.m. ET","CIN at HOU":"1:00 p.m. ET",
  "JAX at DEN":"4:05 p.m. ET","LV at LAC":"4:05 p.m. ET",
  "SEA at ARI":"4:25 p.m. ET","MIA at SF":"4:25 p.m. ET","WSH at DAL":"4:25 p.m. ET",
  "IND at KC":"8:20 p.m. ET"
};
const CARD = [
  {game:"CAR at ATL",href:"nfl-week-2-car-atl.html",side:"PASS the spread",stamp:"PASS",fade:"",prop:"Bijan Robinson over 84.5 rush",td:"Bijan Robinson anytime TD",why:"Coin side. Bijan is the Atlanta engine."},
  {game:"MIN at CHI",href:"nfl-week-2-min-chi.html",side:"PASS the spread",stamp:"PASS",fade:"",prop:"Justin Jefferson over 79.5 rec",td:"Justin Jefferson anytime TD",why:"Coin side. Do not take a Bears name off 59."},
  {game:"PHI at TEN",href:"nfl-week-2-phi-ten.html",side:"Titans +7",stamp:"LEAN",fade:"Eagles ML -337",prop:"Saquon Barkley over 74.5 rush",td:"Saquon Barkley anytime TD",why:"One reason on the dog. Saquon is the Eagles score."},
  {game:"PIT at NE",href:"nfl-week-2-pit-ne.html",side:"Steelers +5.5",stamp:"LEAN",fade:"",prop:"Rhamondre Stevenson over 64.5 rush",td:"Rhamondre Stevenson anytime TD",why:"Low-scoring home script. Stevenson is the floor."},
  {game:"GB at NYJ",href:"nfl-week-2-gb-nyj.html",side:"Jets +3.5",stamp:"LEAN",fade:"",prop:"Breece Hall over 69.5 rush",td:"Breece Hall anytime TD",why:"Jets live if Hall touches 18-plus."},
  {game:"CLE at TB",href:"nfl-week-2-cle-tb.html",side:"Browns +7.5",stamp:"LEAN",fade:"Buccaneers ML -388",prop:"Bucky Irving over 62.5 rush",td:"Bucky Irving anytime TD",why:"Rain. Irving does not need Mayfield to go 300."},
  {game:"NO at BAL",href:"nfl-week-2-no-bal.html",side:"Saints +8.5",stamp:"LEAN",fade:"Ravens ML -375",prop:"Derrick Henry over 79.5 rush",td:"Derrick Henry anytime TD",why:"Flowers OUT. Baltimore still scores on Henry."},
  {game:"CIN at HOU",href:"nfl-week-2-cin-hou.html",side:"Bengals +2.5",stamp:"LEAN",fade:"",prop:"Ja'Marr Chase over 74.5 rec",td:"Ja'Marr Chase anytime TD",why:"Collins OUT. Cincinnati's pass game is Chase."},
  {game:"JAX at DEN",href:"nfl-week-2-jax-den.html",side:"Jaguars +2.5",stamp:"LEAN",fade:"",prop:"Jaylen Waddle over 54.5 rec",td:"Travis Etienne anytime TD",why:"Mims OUT. Do not copy Denver 176."},
  {game:"LV at LAC",href:"nfl-week-2-lv-lac.html",side:"Raiders +6.5",stamp:"LEAN",fade:"Chargers ML -264",prop:"Ashton Jeanty over 64.5 rush",td:"Ashton Jeanty anytime TD",why:"Bowers doubtful. Vegas runs through Jeanty."},
  {game:"SEA at ARI",href:"nfl-week-2-sea-ari.html",side:"Cardinals +3.5",stamp:"LEAN",fade:"",prop:"Jadarian Price over 54.5 rush",td:"Jadarian Price anytime TD",why:"Darnold OUT. Price is the Seattle score that survives."},
  {game:"MIA at SF",href:"nfl-week-2-mia-sf.html",side:"Dolphins +13.5",stamp:"LEAN",fade:"49ers ML -869",prop:"Christian McCaffrey over 64.5 rush",td:"Christian McCaffrey anytime TD",why:"Willis start. Sit both CMC tickets if he sits."},
  {game:"WSH at DAL",href:"nfl-week-2-wsh-dal.html",side:"Commanders +4",stamp:"LEAN",fade:"",prop:"CeeDee Lamb over 79.5 rec",td:"Javonte Williams anytime TD",why:"50.5 total. Lamb volume, Javonte score."},
  {game:"IND at KC",href:"nfl-week-2-ind-kc.html",side:"Colts +6",stamp:"LEAN",fade:"Chiefs ML -285",prop:"Jonathan Taylor over 64.5 rush",td:"Jonathan Taylor anytime TD",why:"Walker mean is 72, not 173. Taylor is the Colts engine."}
];
function kickOf(g){ return KICK[g] || ""; }
function kickMin(g){
  const t = kickOf(g);
  const m = t.match(/(\d+):(\d+)/);
  if (!m) return 9999;
  let h = Number(m[1]); const min = Number(m[2]);
  if (h !== 12) h += 12;
  return h * 60 + min;
}
function windowLabel(g){
  const t = kickOf(g);
  if (/1:00/.test(t)) return "1:00 ET";
  if (/4:05/.test(t)) return "4:05 ET";
  if (/4:25/.test(t)) return "4:25 ET";
  if (/8:20/.test(t)) return "8:20 ET  SNF";
  return t;
}
function prettyCard(iso){
  const p = (iso || "").split("-");
  if (p.length !== 3) return iso || "";
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}).toUpperCase();
}
function gameCard(g){
  const fade = g.fade ? `<b>AWAY</b><span class="away">${g.fade}</span>` : "";
  return `<details class="block"><summary><span class="gsum"><span class="left"><span class="gname">${g.game}</span><span class="gline">${g.side}</span></span><span class="stamp ${g.stamp.toLowerCase()}">${g.stamp}</span></span></summary>
    <div class="body">
      <div class="kv">
        <b>SIDE</b><span>${g.side}</span>
        <b>PROP</b><span>${g.prop}</span>
        <b>TD</b><span>${g.td}</span>
        ${fade}
      </div>
      <p class="note">${g.why}</p>
      <a class="full-link" href="${g.href}">FULL BREAKDOWN</a>
    </div></details>`;
}
async function paintTodayCard(){
  const day = cardDate();
  const dateEl = document.getElementById("card-date");
  if (dateEl) dateEl.textContent = prettyCard(day);
  const unitsBlock = document.getElementById("units-block");
  const unitsEl = document.getElementById("units");
  unitsBlock.open = false;
  unitsEl.innerHTML = `<p class="note">No units. Every ticket on this card is LEAN or PASS.</p>`;

  const list = CARD.slice().sort(function(a,b){ return kickMin(a.game) - kickMin(b.game); });
  let last = ""; let html = `<p class="count">Tap a game. Side, prop, and TD are inside. Confirm live DK.</p>`;
  list.forEach(function(g){
    const win = windowLabel(g.game);
    if (win !== last){ html += `<div class="window">${win}</div>`; last = win; }
    html += gameCard(g);
  });
  document.getElementById("tickets").innerHTML = html;
  if (window.splitStamp) splitStamp();
}
renderToday = paintTodayCard;
paintTodayCard();
</script>
</body></html>
