<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Split -- NFL</title>
<link rel="stylesheet" href="sport.css?v=7"/>
</head>
<body>
<div class="topnav">
<a href="today.html">TODAY</a>
<a class="on" href="nfl.html">NFL</a>
<a href="cfb.html">CFB</a>
<a href="mlb.html">MLB</a>
<a href="reviews.html">BET TRACKER</a>
</div>
<header>
<h1>THE SPLIT</h1>
<div class="sub">NFL</div>
<div class="bank" id="sport-bank"></div>
</header>
<div class="wrap">
<details class="subhead"><summary>DEEP DIVES</summary>
<div class="inner">
<div class="weeks" id="week-btns"></div>
<p class="note">Week 2 slate posts when the board is set.</p>
<div id="slate"></div>
</div></details>
<details class="subhead"><summary>WEEK NOTES</summary>
<div class="inner"><div class="weeks" id="nfl-review-btns"></div><div id="nfl-week-review"></div></div></details>
<details class="subhead"><summary>BETTING NOTES</summary>
<div class="inner" id="betting-notes"><p class="note">Loading notes...</p></div></details>
<details class="subhead"><summary>DFS CHEAT SHEET</summary>
<div class="inner">
<div class="weeks" id="dfs-week-btns"></div>
<div id="dfs-slate-hold">
<p class="note-lab">SELECT A SLATE</p>
<select id="dfs-slate-pick" class="game-pick" aria-label="Select a slate">
<option value="">Select a slate</option>
<option value="nfl-dfs-week-1.html">Main slate</option>
<option value="nfl-dfs-week-1-snf.html">Sunday night</option>
<option value="nfl-dfs-week-1-mnf.html">Monday night</option>
</select>
</div>
</div></details>
<details class="subhead"><summary>DFS NOTES</summary>
<div class="inner" id="dfs-notes"></div></details>
<details class="subhead"><summary>TEAM IDENTITIES</summary>
<div class="inner" id="team-identities"></div></details>
</div>
<script src="schedule.js?v=29"></script>
<script src="nfl-week-review.js?v=8"></script>
<script src="nfl-id-a.js?v=1"></script>
<script src="nfl-id-b.js?v=1"></script>
<script src="nfl-identities.js?v=6"></script>
<script src="tracker.js?v=34"></script>
<script src="notes.js?v=6"></script>
<script src="stamp.js?v=6"></script>
<script>
loadLedger().then(function(data){
  renderBank(document.getElementById("sport-bank"), summarize({bets:(data.bets||[]).filter(function(b){return b.sport==="NFL";})}));
});
paintBettingNotes("NFL");
paintDfsNotes("NFL");
(function(){
  const dfs = document.getElementById("dfs-week-btns");
  const pick = document.getElementById("dfs-slate-pick");
  if (!dfs || !pick) return;
  const b=document.createElement("button");
  b.textContent="Week 1";
  b.className="on";
  dfs.appendChild(b);
  pick.onchange=function(){
    if (pick.value) location.href = pick.value;
  };
})();
</script>
</body></html>
