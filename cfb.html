<div class="wrap">
<details class="subhead" open><summary>DEEP DIVES</summary>
<div class="inner"><div class="weeks" id="cfb-week-btns"></div><div id="cfb-slate"></div></div></details>

<script>
loadLedger().then(function(data){
  renderBank(document.getElementById("sport-bank"), summarize({bets:(data.bets||[]).filter(function(b){return b.sport==="CFB";})}));
});
paintBettingNotes("CFB");
document.querySelectorAll("#cfb-week-btns button").forEach(function(b,i){ if (i > 1) b.remove(); });
document.querySelectorAll("#cfb-review-btns button").forEach(function(b,i){ if (i > 1) b.remove(); });
