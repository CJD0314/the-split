<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Split -- Bet Tracker</title>
<link rel="stylesheet" href="dive.css"/>
<style>
.topnav{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.topnav a.on{color:#3dd68c}
.bank{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.bank div{background:#121820;border:1px solid #2a3644;border-radius:12px;padding:12px;text-align:center}
.bank b{display:block;color:#93a3b5;font-size:10px}.bank span{font-size:20px;font-weight:800}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.filters button{background:#0e141c;border:1px solid #2a3644;color:#93a3b5;border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer}
.filters button.on{border-color:#d4a017;color:#d4a017}
h3.track{color:#d4a017;font-size:12px;letter-spacing:.1em;margin:18px 0 8px}
.slip-row{display:grid;grid-template-columns:72px 1fr 90px 70px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #2a3644}
.slip-row .when{color:#93a3b5;font-size:11px;font-weight:800}
.slip-row .gm{font-weight:800;font-size:13px}
.slip-row .tk{color:#e8eef5;font-size:12px;margin-top:2px}
.slip-row .meta{color:#93a3b5;font-size:11px;margin-top:2px}
.slip-row .sc{color:#93a3b5;font-size:12px;font-weight:800;text-align:right}
.slip-row .pl{text-align:right;font-weight:800}
.ok{color:#3dd68c}.loss{color:#ff6b6b}.push{color:#d4a017}
@media(max-width:640px){
  .slip-row{grid-template-columns:1fr 70px}
  .slip-row .when,.slip-row .pl{display:none}
  .bank{grid-template-columns:1fr 1fr}
}
</style></head>
<body>
<div class="topnav">
<a href="today.html">TODAY</a>
<a href="nfl.html">NFL</a>
<a href="cfb.html">CFB</a>
<a href="mlb.html">MLB</a>
<a class="on" href="reviews.html">BET TRACKER</a>
</div>
<header>
  <div class="brand">THE SPLIT</div>
  <div class="week">BET TRACKER</div>
  <div class="updated">LAST UPDATED: Sat Sep 12, 2026 12:25 p.m. ET</div>
</header>
<div class="wrap">
  <div class="bank" id="review-bank"></div>
  <div class="filters" id="conf-filters">
    <button class="on" data-f="ALL">ALL</button>
    <button data-f="BET">BET ONLY</button>
    <button data-f="LEAN">LEAN+</button>
    <button data-f="FADE">FADE</button>
  </div>
  <div id="review-tables"><p class="note">Loading ledger...</p></div>
</div>
<script src="scores.js?v=6"></script>
<script src="tracker.js?v=24"></script>
<script src="stamp.js?v=2"></script>
<script>
window.REVIEW_FILTER = "ALL";
async function refreshReviews(){
  await renderReviews(window.REVIEW_FILTER);
  if (window.splitStamp) splitStamp();
}
document.getElementById("conf-filters").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  window.REVIEW_FILTER = b.getAttribute("data-f");
  document.querySelectorAll("#conf-filters button").forEach(x => x.classList.toggle("on", x===b));
  refreshReviews();
});
refreshReviews();
</script>
</body></html>
