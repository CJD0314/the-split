name: scores-pass
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull scores
        run: node scripts/sync-scores.mjs
      - name: Commit if changed
        run: |
          git config user.name "the-split-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores.js
          if git diff --cached --quiet; then
            echo "no score change"
          else
            git commit -m "scores pass"
            git push
          fi
