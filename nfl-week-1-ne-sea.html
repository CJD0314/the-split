<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Split -- Patriots at Seahawks</title>
<link rel="stylesheet" href="align.css" />
<style>
:root{--bg:#0b0f14;--panel:#121820;--panel2:#18202a;--line:#2a3644;--text:#e8eef5;--muted:#93a3b5;--gold:#d4a017}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:#0b0f14;color:#e8eef5;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:18px 18px 64px}
.topnav{display:flex;justify-content:center;gap:22px;padding:12px;border-bottom:1px solid var(--line)}
.topnav a{color:var(--gold);text-decoration:none;font-weight:800;font-size:13px;letter-spacing:.08em}
header{text-align:center;padding:20px 16px 8px}.brand{font-size:34px;font-weight:800;letter-spacing:.12em}
.week{color:var(--gold);letter-spacing:.16em;font-weight:700;margin:8px 0 16px}
.logos{display:flex;justify-content:center;gap:28px}.logos img{width:88px;height:88px;object-fit:contain}
h1{font-size:24px;font-weight:800}.meta{color:var(--muted);font-size:14px}
.market{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.tile b{display:block;color:var(--muted);font-size:11px;letter-spacing:.1em;margin-bottom:8px}
.tile span{display:block;font-size:16px;font-weight:800;line-height:1.35;margin:6px 0}
details.block{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:12px 0}
details.block>summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:800;letter-spacing:.08em}
details.block>summary::after{content:" +";color:var(--gold);float:right}details.block[open]>summary::after{content:" -"}
.body{padding:4px 18px 18px;border-top:1px solid var(--line)}
h3{color:var(--gold);font-size:13px;letter-spacing:.08em}
.team-head{display:flex;align-items:center;gap:10px}.team-head img{width:48px;height:48px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 5px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:11px}
.note{color:var(--muted);font-size:13px}.callout{background:var(--panel2);border-left:3px solid var(--gold);padding:12px 14px;margin:10px 0}
.ok{color:#3dd68c;font-weight:800}.bad{color:#ff6b6b;font-weight:800}.push{color:var(--gold);font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.market,.grid2{grid-template-columns:1fr}}
</style></head>
<body>
<div class="topnav"><a href="index.html">HOME</a></div>
<header>
<div class="brand">THE SPLIT</div>
<div class="week">NFL WEEK 1</div>
<div class="logos"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/ne.png" alt="Patriots" /><img src="https://a.espncdn.com/i/teamlogos/nfl/500/sea.png" alt="Seahawks" /></div>
<h1>NEW ENGLAND PATRIOTS VS SEATTLE SEAHAWKS</h1>
<div class="meta">Wednesday, Sept. 9, 2026 | 8:20 p.m. ET | Lumen Field | NBC / Peacock</div>
</header>
<div id="app"><p class="note" style="padding:24px;text-align:center">Loading board...</p></div>
<script>
Promise.all([
  fetch("parts/ne-1.html?v=10").then(r=>r.text()),
  fetch("parts/ne-2.html?v=10").then(r=>r.text()),
  fetch("parts/ne-3.html?v=10").then(r=>r.text())
]).then(parts=>{ document.getElementById("app").innerHTML = parts.join(""); });
</script>
</body></html>
