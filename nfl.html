<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Split -- NFL</title>
<style>
:root{--bg:#0b0f14;--panel:#121820;--line:#2a3644;--text:#e8eef5;--muted:#93a3b5;--gold:#d4a017;--ok:#3dd68c}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:#0b0f14;color:#e8eef5;line-height:1.45}
.topnav{display:flex;justify-content:center;gap:14px;padding:12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b0f14;z-index:5;flex-wrap:wrap}
.topnav a{color:var(--gold);text-decoration:none;font-weight:800;font-size:13px;letter-spacing:.08em}
.topnav a.on{color:#3dd68c}
header{padding:20px 24px 12px;text-align:center}
h1{margin:4px 0 8px;font-size:48px;letter-spacing:.14em;font-weight:800}
.sub,.note{color:var(--muted);font-size:15px}
.wrap{max-width:920px;margin:0 auto;padding:8px 18px 56px}
.bank{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.bank div{background:#121820;border:1px solid #2a3644;border-radius:12px;padding:12px;text-align:center}
.bank b{display:block;color:#93a3b5;font-size:10px;letter-spacing:.1em}
.bank span{font-size:20px;font-weight:800}
.subhead{background:#121820;border:1px solid #2a3644;border-radius:14px;margin:14px 0;overflow:hidden}
.subhead>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;padding:12px 16px;font-size:15px;color:var(--gold);letter-spacing:.08em;font-weight:800}
.subhead>summary::after{content:"+";color:var(--gold)}
.subhead[open]>summary::after{content:"-"}
.inner{padding:0 14px 16px;border-top:1px solid var(--line)}
.weeks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}
.weeks button{padding:10px 6px;border-radius:8px;border:1px solid var(--line);background:#0e141c;color:var(--muted);font-weight:700;cursor:pointer}
.weeks button.on{border-color:var(--ok);color:var(--ok)}
.full-link{color:var(--gold);font-weight:800;text-decoration:underline;font-size:12px}
@media(max-width:640px){.weeks,.bank{grid-template-columns:1fr 1fr}h1{font-size:32px}}
</style></head>
<body>
<div class="topnav">
<a href="today.html">TODAY</a>
<a class="on" href="nfl.html">NFL</a>
<a href="cfb.html">CFB</a>
<a href="mlb.html">MLB</a>
<a href="reviews.html">REVIEWS</a>
</div>
<header>
<h1>THE SPLIT</h1>
<div class="sub">NFL</div>
<div class="bank" id="sport-bank"></div>
<div class="note" id="page-stamp">LAST UPDATED: Fri Sep 11, 2026 11:45 p.m. ET</div>
</header>
<div class="wrap">
<details class="subhead"><summary>DEEP DIVES</summary>
<div class="inner"><div class="weeks" id="week-btns"></div><div id="slate"></div></div></details>
<details class="subhead"><summary>DFS CHEAT SHEET</summary>
<div class="inner"><div class="weeks" id="dfs-week-btns"></div></div></details>
<details class="subhead"><summary>BET TRACKER</summary>
<div class="inner"><p class="note">Full NFL book is on <a class="full-link" href="reviews.html">REVIEWS</a>.</p></div></details>
</div>
<script src="schedule.js?v=16"></script>
<script src="tracker.js?v=20"></script>
<script src="stamp.js"></script>
<script>
loadLedger().then(function(data){
  renderBank(document.getElementById("sport-bank"), summarize({bets:(data.bets||[]).filter(function(b){return b.sport==="NFL";})}));
});
(function(){
  const dfs = document.getElementById("dfs-week-btns");
  for (let i=1;i<=18;i++){
    const b=document.createElement("button");
    b.textContent="Week "+i;
    if (i===1) b.classList.add("on");
    b.onclick=function(){ location.href = i===1 ? "nfl-dfs-week-1.html" : ("nfl-dfs-week.html?w="+i); };
    dfs.appendChild(b);
  }
})();
if (window.closeAllTabs) closeAllTabs();
</script>
</body></html>
