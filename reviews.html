<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Split -- Bet Tracker</title>
<link rel="stylesheet" href="dive.css"/>
<style>
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.filters button{background:#121820;border:1px solid #2a3644;color:#f3f7fb;font-weight:800;letter-spacing:.08em;font-size:12px;padding:8px 12px;border-radius:999px}
.filters button.on,.filters button:active{border-color:#e8b423;color:#e8b423}
.track{color:#e8b423;font-size:12px;letter-spacing:.12em;margin:16px 0 8px}
.tix{background:#121820;border:1px solid #2a3644;border-radius:12px;padding:12px 14px;margin:0 0 8px}
.tix-top{display:flex;align-items:center;gap:8px}
.tix-date{color:#93a3b5;font-size:12px;font-weight:700;letter-spacing:.06em;flex:0 0 auto}
.tix-game{color:#e8b423;font-weight:800;text-decoration:none;flex:1;font-size:15px}
.tix-pick{font-size:17px;font-weight:800;margin:6px 0 2px;line-height:1.3}
.tix-line{color:#c5d0dc;font-size:13px}
.tix-bot{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;gap:10px;font-size:14px;font-weight:800}
.tix-pl{font-size:16px}
.tix-total{display:flex;justify-content:space-between;padding:10px 4px 4px;font-size:14px;color:#c5d0dc}
.tix-total b{color:#f3f7fb}
.stamp{display:inline-block;font-size:10px;letter-spacing:.08em;font-weight:800;border:1px solid #2a3644;border-radius:6px;padding:3px 6px}
.stamp.bet{color:#3dd68c;border-color:#3dd68c}
.stamp.lean{color:#e8b423;border-color:#e8b423}
.stamp.fade{color:#93a3b5}
.bank{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px auto 0;max-width:420px}
@media(min-width:700px){.bank{grid-template-columns:repeat(4,1fr);max-width:720px}}
</style>
</head>
<body>
<div class="topnav">
<a href="today.html">TODAY</a>
<a href="nfl.html">NFL</a>
<a href="cfb.html">CFB</a>
<a href="mlb.html">MLB</a>
<a class="on" href="reviews.html">BET TRACKER</a>
</div>
<header>
<div class="brand">THE SPLIT</div>
<div class="week">BET TRACKER</div>
<h1>EVERY TICKET</h1>
<div class="bank" id="review-bank"></div>
</header>
<div class="wrap">
<div class="filters">
<button type="button" class="on" onclick="renderReviews('ALL')">ALL</button>
<button type="button" onclick="renderReviews('BET')">BET</button>
<button type="button" onclick="renderReviews('LEAN')">LEAN</button>
<button type="button" onclick="renderReviews('FADE')">FADE</button>
</div>
<div id="review-tables"><p class="note">Loading ledger...</p></div>
</div>
<script src="tracker.js?v=34"></script>
<script src="tracker-cards.js?v=1"></script>
<script src="stamp.js?v=6"></script>
<script>
renderReviews('ALL');
if (window.splitStamp) splitStamp();
</script>
</body></html>
