<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Split -- Review</title>
<link rel="stylesheet" href="dive.css"/>
</head>
<body>
<div class="topnav">
<a href="today.html">TODAY</a>
<a href="nfl.html">NFL</a>
<a href="cfb.html">CFB</a>
<a href="mlb.html">MLB</a>
<a href="reviews.html">REVIEWS</a>
</div>
<header>
<div class="brand">THE SPLIT</div>
<div class="week">REVIEW</div>
<h1 id="title">Loading</h1>
<div class="updated">LAST UPDATED: Sat Sep 12, 2026 8:09 a.m. ET</div>
</header>
<div class="wrap" id="body">
<p class="note">Loading ledger...</p>
</div>
<script src="tracker.js?v=21"></script>
<script src="cfb-rank.js"></script>
<script>
const q = new URLSearchParams(location.search);
const sport = (q.get("sport") || "").toUpperCase();
const date = q.get("date") || "";
const game = q.get("game") || "";
function label(g){
  return sport === "CFB" && window.rankCfbGame ? window.rankCfbGame(g) : g;
}
loadLedger().then(function(data){
  const rows = (data.bets || []).filter(function(b){
    return (!sport || b.sport === sport) && (!date || b.date === date) && (!game || b.game === game);
  });
  const title = document.getElementById("title");
  title.textContent = (rows[0] ? label(rows[0].game) : game || "REVIEW") + (rows[0] && rows[0].final ? " · " + rows[0].final : "");
  if (!rows.length) {
    document.getElementById("body").innerHTML = "<p class='note'>No tickets stored for this game.</p>";
    return;
  }
  const right = rows.filter(b => b.result === "WIN");
  const wrong = rows.filter(b => b.result === "LOSS");
  function list(arr, empty){
    if (!arr.length) return "<p class='note'>" + empty + "</p>";
    return "<ul>" + arr.map(b => "<li><b>" + typeLabel(b) + "</b> " + b.pick + " · " + (b.close||"") + " · " + (b.result || b.status) + "</li>").join("") + "</ul>";
  }
  document.getElementById("body").innerHTML = `
    <details class="block" open><summary>TICKETS</summary><div class="body">${list(rows, "None.")}</div></details>
    <details class="block" open><summary>WHAT WE GOT RIGHT</summary><div class="body">${list(right, "Nothing cashed.")}</div></details>
    <details class="block" open><summary>WHAT WE GOT WRONG</summary><div class="body">${list(wrong, "Nothing missed.")}</div></details>
    <details class="block"><summary>WHAT WE MISSED</summary><div class="body"><p class="note">A plus-money dog still needs the starter. A 28-point CFB number is a bench bet.</p></div></details>
    <details class="block"><summary>GET BETTER</summary><div class="body"><p class="note">Do not reuse last night's final on a rematch. Fade juice through a short favorite.</p></div></details>
    <p><a class="full-link" href="reviews.html">FULL BOOK</a></p>`;
});
</script>
</body></html>
