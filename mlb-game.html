<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>The Split -- MLB</title><link rel="stylesheet" href="dive.css"/></head>
<body><div class="topnav"><a href="today.html">TODAY</a><a href="index.html">HOME</a><a href="reviews.html">BETTING REVIEWS</a></div><div id="app"></div>
<script src="mlb-data.js"></script>
<script src="stamp.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
const g = window.MLB && window.MLB[id];
const L = c => "https://a.espncdn.com/i/teamlogos/mlb/500/"+c+".png";
if (!g) {
  document.getElementById("app").innerHTML = '<div class="wrap"><p>Board for this game is still being filled.</p></div>';
} else {
  document.title = "The Split -- "+g.awayName+" at "+g.homeName;
  document.getElementById("app").innerHTML = `
  <header><div class="brand">THE SPLIT</div><div class="week">MLB</div>
  <div class="logos"><img src="${L(g.away)}"/><img src="${L(g.home)}"/></div>
  <h1>${g.awayName.toUpperCase()} VS ${g.homeName.toUpperCase()}</h1>
  <div class="meta">${g.when}</div>
  <div class="updated">LAST UPDATED: Fri Sep 11, 2026 10:02 p.m. ET</div></header>
  <div class="wrap">
  <div class="market">
    <div class="tile"><b>SPREAD</b><span>Closed: ${g.spread}</span><span>Open: ${g.spread}</span></div>
    <div class="tile"><b>TOTAL</b><span>Closed: ${g.total}</span><span>Open: ${g.total}</span></div>
    <div class="tile"><b>MONEYLINE</b><span>Closed: ${g.ml}</span><span>Open: ${g.ml}</span></div>
    <div class="tile"><b>MOVE</b><span>${g.move}</span></div>
  </div>
  <p class="note"><a class="full-link" href="reviews.html">BETTING REVIEWS</a> &nbsp;|&nbsp; <a class="full-link" href="today.html">TODAY</a></p>
  <details class="block" open><summary>TEAM BREAKDOWN</summary><div class="body">
    <div class="tb-row teams">
      <div class="team-head"><img src="${L(g.away)}"/><div><b>${g.awayName.toUpperCase()}</b><div class="note">${g.awayNote}</div></div></div>
      <div class="team-head"><img src="${L(g.home)}"/><div><b>${g.homeName.toUpperCase()}</b><div class="note">${g.homeNote}</div></div></div>
    </div>
    <div class="tb-row"><h3>STAFF</h3><ul><li><b>Manager ${g.mgr[0]}</b></li></ul><ul><li><b>Manager ${g.mgr[1]}</b></li></ul></div>
    <div class="tb-row"><h3>STARTING PITCHER</h3><ul><li>${g.sp[0]}</li></ul><ul><li>${g.sp[1]}</li></ul></div>
    <div class="tb-row"><h3>BULLPEN STATUS</h3><ul><li>${g.status[0]}</li></ul><ul><li>${g.status[1]}</li></ul></div>
    <div class="tb-row"><h3>TRENDS AND IN THE NEWS</h3><ul><li>${g.awayNote}</li></ul><ul><li>${g.homeNote}</li></ul></div>
  </div></details>
  <details class="block" open><summary>STARTING LINEUPS</summary><div class="body"><p>Official MLB.com card at lock.</p></div></details>
  <details class="block" open><summary>SCRIPT</summary><div class="body">
    <h3>${g.awayName.toUpperCase()} WIN IF</h3><p>Starter has to work.</p>
    <h3>${g.homeName.toUpperCase()} WIN IF</h3><p>Same for the home club.</p>
  </div></details>
  <details class="block" open><summary>BEST BET</summary><div class="body"><div class="callout"><div style="font-size:22px;font-weight:800">${g.bet}</div><div style="margin-top:6px">${g.stake}</div></div><ul>${g.why.map(x=>"<li>"+x+"</li>").join("")}</ul></div></details>
  <details class="block" open><summary>HR BEST BET</summary><div class="body"><div class="callout"><div style="font-size:22px;font-weight:800">${g.hr}</div></div></div></details>
  </div>`;
}
</script></body></html>
