<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Split -- Today</title>
<link rel="stylesheet" href="dive.css"/>
<style>
.topnav{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.topnav a.on{color:#3dd68c}
.card-lab{color:#93a3b5;font-size:11px;letter-spacing:.16em;font-weight:800;margin-top:8px}
.card-date{color:#3dd68c;font-size:18px;font-weight:800;letter-spacing:.08em;margin:2px 0 8px}
.g-row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #2a3644}
.g-main{min-width:160px}
.g-name{display:block;font-weight:800;font-size:14px}
.g-pick{display:block;color:#e8eef5;font-size:13px;margin-top:2px}
.g-when{display:block;color:#93a3b5;font-size:11px;margin-top:2px}
.g-side{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.g-score{color:#93a3b5;font-size:11px}
.g-row a{color:#d4a017;font-weight:800;text-decoration:underline;font-size:11px}
.stamp{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.06em}
.stamp.bet{background:#0d2a1c;color:#3dd68c}
.stamp.lean{background:#3d2a00;color:#d4a017}
.stamp.fade{background:#3a1212;color:#ff6b6b}
</style></head>
<body>
<div class="topnav">
<a class="on" href="today.html">TODAY</a>
<a href="nfl.html">NFL</a>
<a href="cfb.html">CFB</a>
<a href="mlb.html">MLB</a>
<a href="reviews.html">REVIEWS</a>
</div>
<header>
<div class="brand">THE SPLIT</div>
<div class="week">TODAY</div>
<div class="card-lab">CARD DATE</div>
<div class="card-date" id="card-date">SAT SEP 12, 2026</div>
<div class="updated">LAST UPDATED: Sat Sep 12, 2026 8:05 a.m. ET</div>
</header>
<div class="wrap">
<details class="block"><summary>TODAY'S TICKETS</summary>
<div class="body" id="tickets"><p class="note">Loading ledger...</p></div></details>
<details class="block"><summary>WHAT WE ARE CHANGING</summary>
<div class="body" id="playbook"><p class="note">Loading playbook...</p></div></details>
<details class="block"><summary>QUICK REVIEWS</summary>
<div class="body" id="loops"></div></details>
<details class="block"><summary>FADES TO REMEMBER</summary>
<div class="body" id="fades"></div></details>
</div>
<script src="cfb-rank.js"></script>
<script src="scores.js?v=4"></script>
<script src="tracker.js?v=21"></script>
<script src="stamp.js"></script>
<script>
function gameScore(b){
  const map = window.SCORES || {};
  return map[(b.date || "") + "|" + b.game] || "";
}
function flatRow(b){
  const conf = String(b.confidence || "LEAN").toUpperCase();
  const href = b.href || "#";
  const day = (b.date || "").slice(5).replace("-", "/");
  const live = gameScore(b);
  const name = b.sport === "CFB" && window.rankCfbGame ? window.rankCfbGame(b.game) : b.game;
  return `<div class="g-row">
    <div class="g-main">
      <span class="g-name">${name}</span>
      <span class="g-pick">${b.pick} · ${b.close || ""}</span>
      <span class="g-when">${day}${live ? " · " + live : ""}</span>
    </div>
    <div class="g-side">
      <span class="stamp ${conf.toLowerCase()}">${conf}</span>
      <span class="g-score">${b.status || "OPEN"}</span>
      <a href="${href}">GAME DETAIL</a>
    </div>
  </div>`;
}
function prettyCard(iso){
  const p = (iso || "").split("-");
  if (p.length !== 3) return iso || "";
  const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return d.toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric", year:"numeric"}).toUpperCase();
}
const _rt = renderToday;
renderToday = async function(){
  await _rt();
  const el = document.getElementById("card-date");
  if (el) el.textContent = prettyCard(cardDate());
  const line = document.getElementById("tagline");
  if (line) line.remove();
};
renderToday();
if (window.closeAllTabs) closeAllTabs();
</script>
</body></html>
